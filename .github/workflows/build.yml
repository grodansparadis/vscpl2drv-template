name: Build

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libssl-dev libexpat1-dev pandoc

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build -j$(nproc)

    - name: Package
      working-directory: ${{github.workspace}}/build
      run: cpack -G DEB

    - name: Write SHA256SUMS
      id: sha256sums_33
      continue-on-error: true
      shell: bash
      run: |
        bash .github/scripts/write-sha256sums.sh "SHA256SUMS-${{ matrix.os }}_vscpl2drv-template_deb" <<'SHA256SUMS_PATTERNS'
        ${{github.workspace}}/build/*.deb
        SHA256SUMS_PATTERNS

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}_vscpl2drv-template_deb
        path: |
          ${{github.workspace}}/build/*.deb
          ${{ steps.sha256sums_33.outputs.file }}
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: brew install cmake openssl@3 expat

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

    - name: Build
      run: cmake --build ${{github.workspace}}/build -j3
